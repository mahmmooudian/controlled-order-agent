[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-order-agent"
version = "2.0.0"
description = "A policy-controlled AI agent for safe order tracking and human-approved actions."
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    "pydantic>=2.13,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6,<7",
]

llm = [
    "openai",
]

dev = [
    "pytest>=8,<9",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]