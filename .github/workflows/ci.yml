name: CI

on:
  push:
    branches:
      - main
      - v2-production

  pull_request:
    branches:
      - main
      - v2-production


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # ==========================================================
  # CORE APPLICATION
  # ==========================================================

  core-tests:
    name: Core / Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install core and development dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q src evals
          python -m py_compile gui_qt.py

      - name: Run core test suite
        run: |
          pytest -q


  # ==========================================================
  # OPTIONAL OPENAI PLANNER
  # ==========================================================

  optional-llm:
    name: Optional OpenAI Planner

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install LLM integration dependencies
        run: |
          python -m pip install -e ".[dev,llm]"

      - name: Test optional LLM planner
        run: |
          pytest tests/unit/test_llm_planner.py -q


  # ==========================================================
  # PRODUCTION-STYLE EVALUATION
  # ==========================================================

  evaluation:
    name: Production Evaluation

    runs-on: ubuntu-latest

    needs:
      - core-tests
      - optional-llm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          python -m pip install -e ".[dev]"

      - name: Run production-style evaluation
        run: |
          python -m evals.run_evals

      - name: Generate machine-readable evaluation report
        run: |
          python -m evals.run_evals --json-output evaluation-report.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: controlled-agent-evaluation
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14