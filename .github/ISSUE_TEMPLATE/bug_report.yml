name: Bug Report
description: Report a reproducible problem in the Controlled Order Agent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        Please provide enough information to reproduce the issue.
        Do not include API keys, credentials, private database contents,
        or other sensitive information.

  - type: textarea
    id: summary
    attributes:
      label: Problem Summary
      description: Briefly describe the problem.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Start the API with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: "Example: Python 3.11.9"

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Example: Windows 11 / Ubuntu 24.04"

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Paste only sanitized logs.
        Remove credentials, tokens, private data, and secrets.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and sensitive information from this report.
          required: true
        - label: I can reproduce the issue with the current version of the repository.
          required: true